[outgoing-http]
exten => frolax.agency,1,NoOp(Call received from ${CALLERID(num)} to ${EXTEN})

    same => n,Set(IDX=1)

    same => n,While($[${IDX} <= ${STEP_COUNT}])

        same => n,Set(TYPE=${STEP_${IDX}_TYPE})
        same => n,Set(VALUE=${STEP_${IDX}_VALUE})

        same => n,NoOp(Step ${IDX}: TYPE=${TYPE}, VALUE=${VALUE})

        same => n,GotoIf($["${TYPE}" = "url"]?play_url)
        same => n,GotoIf($["${TYPE}" = "digits"]?play_digits)
        same => n,Goto(next)

        same => n(play_url),Playback(${VALUE})
        same => n,Goto(next)

        same => n(play_digits),SayDigits(${VALUE})
        same => n,Goto(next)

        same => n(next),Set(IDX=$[${IDX} + 1])

    same => n,EndWhile()

    same => n,Hangup()
